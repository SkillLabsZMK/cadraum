<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD/CAM-Raum – Virtueller Rundgang</title>
<style>
  :root { --bg:#0e1420; --panel:rgba(16,22,36,.88); --line:rgba(255,255,255,.14); --text:#eef2f8; --muted:#a9b4c6; --accent:#ff8a2a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.45 "Segoe UI",system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; } canvas.hit { cursor:pointer; }
  #top { position:fixed; left:16px; top:14px; right:16px; display:flex; gap:10px; align-items:center; pointer-events:none; flex-wrap:wrap; }
  #top > * { pointer-events:auto; }
  h1 { font-size:17px; margin:0 8px 0 0; font-weight:600; text-shadow:0 1px 6px #000; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#1a1205; border-color:var(--accent); }
  #list { position:fixed; left:16px; top:60px; bottom:64px; width:250px; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:auto; padding:8px; display:none; }
  #list.open { display:block; }
  #list div { padding:7px 10px; border-radius:8px; cursor:pointer; }
  #list div:hover, #list div.act { background:rgba(255,138,42,.22); }
  #list small { display:block; color:var(--muted); font-size:12px; }
  .tag { position:fixed; left:0; top:0; transform:translate(-50%,-100%); padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.93); color:#14203a; font-size:12.5px; font-weight:600; white-space:nowrap; pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,.35); transition:opacity .2s; will-change:transform; }
  .tag.act { background:var(--accent); color:#1a1205; }
  #card { position:fixed; left:0; top:0; width:330px; max-width:calc(100vw - 24px); background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px; padding:12px 14px 13px; pointer-events:none; opacity:0; transition:opacity .15s; box-shadow:0 10px 30px rgba(0,0,0,.5); backdrop-filter:blur(6px); }
  #card.show { opacity:1; }
  #card .kat { color:var(--accent); font-size:12px; letter-spacing:.04em; text-transform:uppercase; }
  #card h2 { margin:2px 0 6px; font-size:18px; }
  #card p { margin:0; color:var(--text); }
  #card ul { margin:8px 0 0; padding-left:18px; color:var(--muted); }
  #card.pin { pointer-events:auto; max-height:calc(100vh - 130px); overflow:auto; }
  .tag i { display:none; width:9px; height:9px; border-radius:50%; margin-left:6px; vertical-align:baseline; }
  .tag i.free { display:inline-block; background:#1faa59; } .tag i.busy { display:inline-block; background:#e5392f; }
  #list b { float:right; font-weight:500; font-size:12px; margin-top:2px; } #list b.free { color:#5fd08f; } #list b.busy { color:#ff7a70; }
  .cal { margin-top:10px; padding-top:9px; border-top:1px solid var(--line); font-size:14px; }
  .cal .st { font-weight:600; } .cal .st.free { color:#5fd08f; } .cal .st.busy { color:#ff7a70; }
  .cal .st::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:currentColor; margin-right:7px; }
  .cal ol { list-style:none; margin:6px 0 0; padding:0; color:var(--text); }
  .cal ol li { padding:3px 0; border-bottom:1px dashed var(--line); } .cal ol span { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px; }
  .cal .none { color:var(--muted); margin-top:5px; font-size:13px; }
  .cal form { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px; }
  .cal label { font-size:12px; color:var(--muted); display:block; } .cal .w { grid-column:1 / -1; }
  .cal input { width:100%; font:inherit; color:var(--text); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:7px; padding:6px 8px; color-scheme:dark; }
  .cal input:focus { outline:2px solid var(--accent); outline-offset:0; }
  .cal form button { grid-column:1 / -1; background:var(--accent); color:#1a1205; border-color:var(--accent); font-weight:600; }
  .cal form button:disabled { opacity:.6; cursor:wait; }
  .cal .msg { grid-column:1 / -1; font-size:13px; min-height:1em; } .cal .msg.ok { color:#5fd08f; } .cal .msg.bad { color:#ff7a70; }
  #hint { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 16px; color:var(--muted); font-size:13px; white-space:nowrap; max-width:calc(100vw - 24px); overflow:hidden; text-overflow:ellipsis; }
  #load { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); font-size:16px; text-align:center; padding:24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tags"></div>
<div id="top">
  <h1>CAD/CAM-Raum 4.412 · 3D-Druck / Fräsen</h1>
  <button id="bList">Geräteliste</button>
  <button id="bPrev" title="Vorheriges Gerät">◀</button>
  <button id="bNext" title="Nächstes Gerät">Rundgang ▶</button>
  <button id="bTags" class="on">Beschriftungen</button>
  <button id="bHome">Zur Tür</button>
</div>
<div id="list"></div>
<div id="card"></div>
<div id="hint">Ziehen: umsehen · W A S D / Pfeiltasten: gehen · Klick auf Boden: dorthin gehen · Gerät: Maus darüber = Erklärung, Klick = hingehen</div>
<div id="load">Rundgang wird geladen …</div>

<script src="geraete.js?v=3"></script>
<script src="kalender-config.js?v=3"></script>
<script src="model.js?v=3"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const G = window.CAM_GERAETE || {};
const TOUR = ['waschbecken','xtool','therm3','psa','muell','formcurel','a1_regal','formcure','a1_platte','form3b_ost','p1s','sauger','matik','pc','form3bl','form3b_west','formwashl','abzug','formwash','material'];
const EYE = 1.62;
// Blender (x, y, z) -> three (x, z, -y)
const B = (x, y, z = 0) => new THREE.Vector3(x, z, -y);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1420);
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 60);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xffffff, 0x6f7a99, 0.7));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));
for (const y of [1.2, 3.3, 5.4]) {
  for (const x of [1.1, 2.9]) {
    const p = new THREE.PointLight(0xfff6ea, 2.6, 9, 1.6);
    p.position.copy(B(x, y, 2.35)); scene.add(p);
  }
}

// ---------- Begehbarkeit (Blender-Koordinaten, Hindernisse mit Sicherheitsabstand) ----------
const BOUNDS = { x0: 0.28, x1: 3.68, y0: 0.28, y1: 6.42 };
const BLOCK = [
  [0, 0, 0.82, 2.9], [0, 2.6, 1.1, 4.4], [0, 4.1, 0.82, 6.6],        // Westzeile
  [1.68, 5.82, 3.96, 6.6],                                              // Waschbecken-Zeile
  [1.52, 4.42, 3.96, 5.38],                                            // Raumteiler + Tonnen
  [3.18, 3.2, 3.96, 4.6], [3.3, 2.45, 3.96, 3.2],                       // FDM-Platte, Sauger
  [2.93, 0.42, 3.96, 2.08], [2.78, 0, 3.96, 0.62],                      // Matik, CAM-Arbeitsplatz
  [1.38, 0, 2.32, 1.02]                                                 // Rollwagen/Heizkoerper
];
const free = (x, y) => x >= BOUNDS.x0 && x <= BOUNDS.x1 && y >= BOUNDS.y0 && y <= BOUNDS.y1 &&
  !BLOCK.some(r => x > r[0] && x < r[2] && y > r[1] && y < r[3]);

// ---------- Kamera-Zustand ----------
const pos = { x: 1.25, y: 6.1 };       // Blender x/y
let yaw = Math.PI, pitch = -0.08;      // yaw=PI: Blick nach Sueden (Fenster)
let fly = null;
function applyCam() {
  camera.position.copy(B(pos.x, pos.y, EYE));
  camera.rotation.set(pitch, yaw, 0);
}
function flyTo(x, y, lookAt, dur = 900) {
  let ty = yaw, tp = pitch;
  if (lookAt) {
    const from = B(x, y, EYE), d = lookAt.clone().sub(from);
    ty = Math.atan2(-d.x, -d.z); tp = Math.atan2(d.y, Math.hypot(d.x, d.z));
    tp = Math.max(-1.1, Math.min(1.1, tp));
  }
  let dy = ty - yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  fly = { t0: performance.now(), dur, x0: pos.x, y0: pos.y, x1: x, y1: y, yaw0: yaw, dyaw: dy, p0: pitch, p1: tp };
}
function goHome() { flyTo(1.25, 6.1, B(2.2, 1.5, 1.2)); }

// ---------- Modell laden ----------
const devices = {};     // id -> { node, meshes, box, center, front, tag }
const pickables = [];
// Schranktueren (Materialschraenke): per Klick oeffnen/schliessen
const doors = []; let doorsOpen = false, doorT = 0;
const qDoor = new THREE.Quaternion(), UP = new THREE.Vector3(0, 1, 0);
function setDoors(open) { doorsOpen = open; }
let floorMesh = null;
function b64ToBuffer(b64) {
  const bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}
new GLTFLoader().parse(b64ToBuffer(window.CAM_MODEL_B64), '', (gltf) => {
  scene.add(gltf.scene);
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse(o => {
    if (o.userData && o.userData.device_id) {
      devices[o.userData.device_id] = { node: o, meshes: [], id: o.userData.device_id };
    }
  });
  gltf.scene.traverse(o => {
    if (o.userData && typeof o.userData.door_open_deg === 'number')
      doors.push({ node: o, base: o.quaternion.clone(), ang: THREE.MathUtils.degToRad(o.userData.door_open_deg) });
  });
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    if (o.name === 'Boden') floorMesh = o;
    let p = o, dev = null;
    while (p) { if (p.userData && p.userData.device_id) { dev = devices[p.userData.device_id]; break; } p = p.parent; }
    if (dev) {
      o.material = o.material.clone();
      o.userData.dev = dev.id;
      o.userData.em = o.material.emissive.clone();
      o.userData.emI = o.material.emissiveIntensity;
      dev.meshes.push(o);
    }
    pickables.push(o);
  });
  const tags = document.getElementById('tags');
  for (const d of Object.values(devices)) {
    d.box = new THREE.Box3();
    d.meshes.forEach(m => d.box.expandByObject(m));
    d.center = d.box.getCenter(new THREE.Vector3());
    d.front = new THREE.Vector3(0, 0, 1).applyQuaternion(d.node.getWorldQuaternion(new THREE.Quaternion())).setY(0).normalize();
    const info = G[d.id] || { name: d.node.userData.title || d.id };
    const el = document.createElement('div');
    el.className = 'tag'; el.textContent = info.name; el.appendChild(document.createElement('i'));
    tags.appendChild(el); d.tag = el;
    const top = Math.min(d.box.max.y + 0.1, 2.15);
    d.tagPos = new THREE.Vector3(d.center.x, top, d.center.z);
    if (d.box.max.y > 2.15) d.tagPos.addScaledVector(d.front, (d.box.max.x - d.box.min.x) * Math.abs(d.front.x) / 2 + (d.box.max.z - d.box.min.z) * Math.abs(d.front.z) / 2 + 0.05);
  }
  buildList();
  if (CAL_URL) { if (CAL_URL === 'demo') demoInit(); loadBookings(); setInterval(loadBookings, 120000); setInterval(refreshStatus, 30000); }
  document.getElementById('load').remove();
  applyCam(); goHome();
}, (e) => { document.getElementById('load').textContent = 'Modell konnte nicht geladen werden: ' + e; });

// ---------- Geraeteliste / Rundgang ----------
let tourIdx = -1, active = null, pinned = null;
// feste Standpunkte (Blender x/y) fuer Geraete, bei denen der automatische zu nah waere
const STAND = { material: [1.5, 5.15], xtool: [2.55, 5.6], therm3: [2.9, 5.6], waschbecken: [1.5, 5.75] };
function standpoint(d) {
  if (STAND[d.id]) return { x: STAND[d.id][0], y: STAND[d.id][1] };
  const cx = d.center.x, cy = -d.center.z, fx = d.front.x, fy = -d.front.z;
  for (let s = 1.5; s >= 0.3; s -= 0.1) {
    const x = cx + fx * s, y = cy + fy * s;
    if (free(x, y)) return { x, y };
  }
  let best = null, bd = 1e9;                       // sonst: naechster freier Punkt im Raster
  for (let x = 0.3; x <= 3.7; x += 0.1) for (let y = 0.3; y <= 6.4; y += 0.1) {
    if (!free(x, y)) continue;
    const dd = (x - cx) ** 2 + (y - cy) ** 2 - 0.5 * ((x - cx) * fx + (y - cy) * fy);
    if (dd < bd) { bd = dd; best = { x, y }; }
  }
  return best;
}
function visit(id) {
  const d = devices[id]; if (!d) return;
  const s = standpoint(d);
  flyTo(s.x, s.y, d.center);
  camera.fov = id === 'material' ? 88 : 72; camera.updateProjectionMatrix();   // Schraenke: Weitwinkel, damit beide ins Bild passen
  tourIdx = TOUR.indexOf(id);
  if (pinned !== id) calMsg = null;
  if (id === 'material') setDoors(pinned === id ? !doorsOpen : true);   // erster Klick oeffnet, weiterer Klick schliesst/oeffnet
  pinned = id; setActive(id, false); showCard(id, null);
  document.querySelectorAll('#list div').forEach(e => e.classList.toggle('act', e.dataset.id === id));
}
function buildList() {
  const list = document.getElementById('list');
  for (const id of TOUR) {
    if (!devices[id]) continue;
    const info = G[id] || {};
    const e = document.createElement('div'); e.dataset.id = id;
    e.innerHTML = `<b></b>${info.name || id}<small>${info.kategorie || ''}</small>`;
    e.onclick = () => visit(id);
    list.appendChild(e);
  }
}
document.getElementById('bList').onclick = (e) => { document.getElementById('list').classList.toggle('open'); e.target.classList.toggle('on'); };
document.getElementById('bNext').onclick = () => { tourIdx = (tourIdx + 1) % TOUR.length; visit(TOUR[tourIdx]); };
document.getElementById('bPrev').onclick = () => { tourIdx = (tourIdx - 1 + TOUR.length) % TOUR.length; visit(TOUR[tourIdx]); };
document.getElementById('bHome').onclick = () => { pinned = null; setActive(null); hideCard(); goHome(); };
let showTags = true;
document.getElementById('bTags').onclick = (e) => { showTags = !showTags; e.target.classList.toggle('on', showTags); };

// ---------- Google Kalender: Belegung anzeigen und buchen ----------
const CAL_URL = (window.CAM_KALENDER_URL || '').trim();
const BOOKABLE = new Set(window.CAM_BUCHBAR || []);
let bookings = {}, calVer = 0, calErr = CAL_URL ? 'Belegung wird geladen …' : '', calMsg = null;
const demo = {};
function demoInit() {
  const t = new Date(); t.setMinutes(0, 0, 0);
  const mk = (id, h0, h1, titel) => (demo[id] = demo[id] || []).push({ start: new Date(t.getTime() + h0 * 3600e3).toISOString(), end: new Date(t.getTime() + h1 * 3600e3).toISOString(), titel });
  mk('therm3', -1, 2); mk('form3bl', 3, 6); mk('p1s', 24, 27);
}
async function calList() {
  if (CAL_URL === 'demo') return { ok: true, buchungen: JSON.parse(JSON.stringify(demo)) };
  return (await fetch(CAL_URL, { redirect: 'follow' })).json();
}
async function calBook(p) {
  if (CAL_URL === 'demo') {
    const l = demo[p.geraet] = demo[p.geraet] || [];
    const k = l.find(b => new Date(b.start) < new Date(p.ende) && new Date(b.end) > new Date(p.start));
    if (!/^\d{4,}$/.test(p.pin || '')) return { ok: false, fehler: 'PIN ist nicht korrekt.' };
    if (k) return { ok: false, fehler: 'Bereits belegt.' };
    l.push({ start: p.start, end: p.ende }); return { ok: true };
  }
  // text/plain vermeidet die CORS-Vorabanfrage, die Apps Script nicht beantwortet
  return (await fetch(CAL_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) })).json();
}
async function loadBookings() {
  if (!CAL_URL) return;
  try {
    const j = await calList();
    if (!j.ok) throw new Error(j.fehler || 'Fehler');
    const nb = {};
    for (const [id, l] of Object.entries(j.buchungen || {}))
      nb[id] = (l || []).map(b => ({ start: new Date(b.start), end: new Date(b.end) })).sort((a, b) => a.start - b.start);
    bookings = nb; calErr = '';
  } catch (e) { calErr = 'Kalender nicht erreichbar – Belegung evtl. nicht aktuell.'; }
  calVer++; refreshStatus();
  if (pinned && !document.activeElement?.closest?.('#card')) showCard(pinned, null);
}
const pad = n => String(n).padStart(2, '0');
const fmtT = d => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const fmtD = d => d.toDateString() === new Date().toDateString() ? 'Heute' : d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function statusOf(id) {
  if (!BOOKABLE.has(id) || !CAL_URL) return null;
  const now = new Date(), l = (bookings[id] || []).filter(b => b.end > now);
  const cur = l.find(b => b.start <= now);
  if (cur) return { busy: true, text: 'Belegt bis ' + (cur.end.toDateString() !== now.toDateString() ? fmtD(cur.end) + ' ' : '') + fmtT(cur.end), list: l };
  return { busy: false, text: l.length ? 'Frei bis ' + fmtD(l[0].start) + ' ' + fmtT(l[0].start) : 'Frei', list: l };
}
function refreshStatus() {
  for (const d of Object.values(devices)) {
    const s = statusOf(d.id), dot = d.tag.querySelector('i');
    if (dot) dot.className = s ? (s.busy ? 'busy' : 'free') : '';
  }
  document.querySelectorAll('#list div').forEach(e => {
    const s = statusOf(e.dataset.id), el = e.querySelector('b');
    if (el) { el.textContent = s ? (s.busy ? 'belegt' : 'frei') : ''; el.className = s && s.busy ? 'busy' : 'free'; }
  });
}
function calHtml(id, withForm) {
  const s = statusOf(id); if (!s) return '';
  let h = `<div class="cal"><div class="st ${s.busy ? 'busy' : 'free'}">${esc(s.text)}</div>`;
  if (calErr) h += `<div class="none">${esc(calErr)}</div>`;
  if (s.list.length) h += '<ol>' + s.list.slice(0, 5).map(b => `<li><span>${fmtD(b.start)} ${fmtT(b.start)}–${fmtT(b.end)}</span>belegt</li>`).join('') + '</ol>' +
    (s.list.length > 5 ? `<div class="none">+ ${s.list.length - 5} weitere</div>` : '');
  else if (!calErr) h += '<div class="none">Keine Reservierungen in den nächsten 14 Tagen.</div>';
  if (!withForm) return h + '<div class="none">Klicken, um zu reservieren.</div></div>';
  const a = new Date(); a.setMinutes(0, 0, 0); a.setHours(a.getHours() + 1);
  const b = new Date(a.getTime() + 3600e3);
  let name = ''; try { name = localStorage.getItem('cam_name') || ''; } catch (e) {}
  h += `<form id="bk">
    <div class="w"><label for="bk_n">Name</label><input id="bk_n" name="n" required maxlength="80" value="${esc(name)}" autocomplete="name"></div>
    <div class="w"><label for="bk_d">Datum</label><input id="bk_d" name="d" type="date" required value="${a.getFullYear()}-${pad(a.getMonth() + 1)}-${pad(a.getDate())}"></div>
    <div><label for="bk_a">Von</label><input id="bk_a" name="a" type="time" required step="900" value="${pad(a.getHours())}:00"></div>
    <div><label for="bk_b">Bis</label><input id="bk_b" name="b" type="time" required step="900" value="${pad(b.getHours())}:00"></div>
    <div class="w"><label for="bk_t">Notiz (optional)</label><input id="bk_t" name="t" maxlength="300"></div>
    <div class="w"><label for="bk_p">Buchungs-PIN</label><input id="bk_p" name="p" type="password" inputmode="numeric" required maxlength="12" autocomplete="off"></div>
    <button type="submit">Reservieren</button>
    <div class="msg ${calMsg ? (calMsg.ok ? 'ok' : 'bad') : ''}" role="status">${calMsg ? esc(calMsg.text) : (CAL_URL === 'demo' ? 'Demo-Modus: Es wird nichts im Kalender gespeichert.' : '')}</div>
  </form>`;
  return h + '</div>';
}
function bindForm(id) {
  const f = document.getElementById('bk'); if (!f) return;
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = f.querySelector('button'), msg = f.querySelector('.msg'), name = f.n.value.trim();
    const start = new Date(`${f.d.value}T${f.a.value}`); let ende = new Date(`${f.d.value}T${f.b.value}`);
    if (ende <= start) ende = new Date(ende.getTime() + 864e5);          // "Bis" nach Mitternacht
    if (!name || isNaN(start) || isNaN(ende)) { msg.className = 'msg bad'; msg.textContent = 'Bitte Name, Datum und Zeiten ausfüllen.'; return; }
    try { localStorage.setItem('cam_name', name); } catch (e) {}
    btn.disabled = true; btn.textContent = 'Wird eingetragen …';
    let r;
    try { r = await calBook({ geraet: id, name, pin: f.p.value, start: start.toISOString(), ende: ende.toISOString(), notiz: f.t.value }); }
    catch (e) { r = { ok: false, fehler: 'Kalender nicht erreichbar. Bitte später erneut versuchen.' }; }
    if (r.ok) {
      calMsg = { ok: true, text: `Reserviert: ${fmtD(start)} ${fmtT(start)}–${fmtT(ende)}` };
      document.activeElement?.blur?.();
      await loadBookings();
      if (pinned === id) showCard(id, null);
    } else {
      btn.disabled = false; btn.textContent = 'Reservieren';
      msg.className = 'msg bad'; msg.textContent = r.fehler || 'Buchung fehlgeschlagen.';
    }
  };
}

// ---------- Hover / Karte ----------
const card = document.getElementById('card');
let activeGlow = true;
function setActive(id, glow = true) {          // glow=false: nur Beschriftung hervorheben (angeklicktes Geraet in Originalfarben)
  if (active === id && activeGlow === glow) return;
  activeGlow = glow;
  for (const d of Object.values(devices)) {
    const on = d.id === id;
    d.tag.classList.toggle('act', on);
    d.meshes.forEach(m => {
      if (on && glow) { m.material.emissive.setRGB(1.0, 0.45, 0.08); m.material.emissiveIntensity = 0.16; }
      else { m.material.emissive.copy(m.userData.em); m.material.emissiveIntensity = m.userData.emI; }
    });
  }
  active = id;
}
let cardKey = '';
function showCard(id, ev) {
  const key = id + (ev ? '|h|' : '|p|') + calVer;
  if (key !== cardKey) {                     // nur bei Aenderung neu aufbauen (Formular-Eingaben bleiben erhalten)
    cardKey = key;
    const info = G[id] || { name: id, text: '' };
    card.innerHTML = `<div class="kat">${info.kategorie || ''}</div><h2>${info.name}</h2><p>${info.text || ''}</p>` +
      (info.punkte && info.punkte.length ? '<ul>' + info.punkte.map(p => `<li>${p}</li>`).join('') + '</ul>' : '') + calHtml(id, !ev);
    card.classList.toggle('pin', !ev);
    if (!ev) bindForm(id);
  }
  card.classList.add('show');
  const w = card.offsetWidth, h = card.offsetHeight;
  let x, y;
  if (ev) { x = ev.clientX + 18; y = ev.clientY + 18; if (x + w > innerWidth - 12) x = ev.clientX - w - 18; if (y + h > innerHeight - 12) y = ev.clientY - h - 18; }
  else { x = innerWidth - w - 16; y = 60; }
  card.style.transform = `translate(${Math.max(12, x)}px, ${Math.max(12, y)}px)`;
}
function hideCard() { card.classList.remove('show', 'pin'); cardKey = ''; }

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  // durchsichtige Scheiben (Glas) ueberspringen, wenn kein Geraet
  for (const h of hits) { if (h.object.material.transparent && !h.object.userData.dev && h.object.material.opacity < 0.5) continue; return h; }
  return null;
}
let down = null, dragging = false;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, yaw, pitch }; dragging = false; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!dragging && Math.hypot(dx, dy) > 5) { dragging = true; canvas.classList.add('drag'); fly = null; }
    if (dragging) {
      yaw = down.yaw + dx * 0.0042; pitch = Math.max(-1.2, Math.min(1.2, down.pitch + dy * 0.0042));
      return;
    }
  }
  const h = pick(e), id = h && h.object.userData.dev;
  canvas.classList.toggle('hit', !!id);
  if (id && id !== pinned) { setActive(id); showCard(id, e); }
  else if (pinned) { setActive(pinned, false); showCard(pinned, null); }
  else { setActive(null); hideCard(); }
});
canvas.addEventListener('pointerup', (e) => {
  canvas.classList.remove('drag');
  const wasDrag = dragging; down = null; dragging = false;
  if (wasDrag) return;
  const h = pick(e); if (!h) return;
  const id = h.object.userData.dev;
  if (id) { visit(id); return; }
  pinned = null;
  if (h.object === floorMesh || h.face && h.face.normal.y > 0.9 && h.point.y < 0.2) {
    const x = h.point.x, y = -h.point.z;
    // Richtung Ziel gehen, vor Hindernissen stoppen
    let tx = pos.x, ty = pos.y;
    for (let i = 1; i <= 40; i++) { const nx = pos.x + (x - pos.x) * i / 40, ny = pos.y + (y - pos.y) * i / 40; if (!free(nx, ny)) break; tx = nx; ty = ny; }
    fly = { t0: performance.now(), dur: 700, x0: pos.x, y0: pos.y, x1: tx, y1: ty, yaw0: yaw, dyaw: 0, p0: pitch, p1: pitch };
  }
});
canvas.addEventListener('pointerleave', () => { if (!pinned) { setActive(null); hideCard(); } });
canvas.addEventListener('wheel', (e) => { camera.fov = Math.max(35, Math.min(85, camera.fov + e.deltaY * 0.03)); camera.updateProjectionMatrix(); e.preventDefault(); }, { passive: false });

const keys = {};
addEventListener('keydown', (e) => { if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; keys[e.code] = true; if (e.code === 'Escape') { pinned = null; setActive(null); hideCard(); } });
addEventListener('keyup', (e) => { keys[e.code] = false; });

// ---------- Schleife ----------
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const v = new THREE.Vector3(), occRay = new THREE.Raycaster();
let last = performance.now(), occI = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fly) {
    let k = Math.min(1, (now - fly.t0) / fly.dur); k = k * k * (3 - 2 * k);
    pos.x = fly.x0 + (fly.x1 - fly.x0) * k; pos.y = fly.y0 + (fly.y1 - fly.y0) * k;
    yaw = fly.yaw0 + fly.dyaw * k; pitch = fly.p0 + (fly.p1 - fly.p0) * k;
    if (k >= 1) fly = null;
  }
  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const turn = (keys.ArrowLeft || keys.KeyQ ? 1 : 0) - (keys.ArrowRight || keys.KeyE ? 1 : 0);
  if (turn) yaw += turn * 1.6 * dt;
  if (f || s) {
    fly = null;
    const sp = 1.8 * dt, sn = Math.sin(yaw), cs = Math.cos(yaw);
    // three: vorwaerts = (-sin yaw, -cos yaw) in (x,z); Blender y = -z
    const dx = (-sn * f + cs * s) * sp, dy = (cs * f + sn * s) * sp;
    if (free(pos.x + dx, pos.y)) pos.x += dx;
    if (free(pos.x, pos.y + dy)) pos.y += dy;
  }
  const dTarget = doorsOpen ? 1 : 0;
  if (doorT !== dTarget) {
    doorT = Math.max(0, Math.min(1, doorT + Math.sign(dTarget - doorT) * dt / 0.9));
    const k = doorT * doorT * (3 - 2 * doorT);
    for (const d of doors) { qDoor.setFromAxisAngle(UP, d.ang * k); d.node.quaternion.copy(d.base).multiply(qDoor); }
  }
  applyCam();
  renderer.render(scene, camera);
  // Beschriftungen
  const list = Object.values(devices);
  if (list.length) {
    const chk = list[occI++ % list.length];             // Verdeckung reihum pruefen
    v.copy(chk.tagPos).sub(camera.position); const dist = v.length();
    occRay.set(camera.position, v.normalize()); occRay.far = dist - 0.05;
    const hit = occRay.intersectObjects(pickables, false).find(h => h.object.userData.dev !== chk.id && !(h.object.material.transparent && h.object.material.opacity < 0.5));
    chk.hidden = !!hit;
    for (const d of list) {
      v.copy(d.tagPos).project(camera);
      const dd = d.tagPos.distanceTo(camera.position);
      const vis = showTags && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && dd < 7;
      if (!vis) { d.tag.style.opacity = 0; continue; }
      d.tag.style.opacity = d.id === active ? 1 : (d.hidden ? 0 : (dd > 4.5 ? 0.6 : 0.95));
      d.tag.style.transform = `translate(-50%,-100%) translate(${(v.x + 1) / 2 * innerWidth}px, ${(1 - v.y) / 2 * innerHeight}px)`;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
